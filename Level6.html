    // === NEON DASH DREAMY SFX ENGINE (shared across all levels) ===
    // Aligned per final overseer for continuity (9yo sci-fi daydream universe)
    let audioCtx;
    let muted = false;
    const masterVol = 0.22;

    function getAudioCtx() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) { /* silent fail on old browsers */ }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freq, durationMs, type = 'sine', vol = 0.2, attackMs = 8, decayMs = 80) {
      const ctx = getAudioCtx();
      if (!ctx || muted) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = type;
      osc.frequency.value = freq;

      filter.type = 'lowpass';
      filter.frequency.value = Math.min(2800, freq * 3.5 + 400);

      const now = ctx.currentTime;
      const dur = durationMs / 1000;

      gain.gain.value = 0;
      gain.gain.linearRampToValueAtTime(vol * masterVol, now + (attackMs / 1000));
      gain.gain.linearRampToValueAtTime(0.0001, now + dur + 0.08);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + dur + 0.15);
    }

    function playNoise(durationMs, vol = 0.15, filterHz = 1200, type = 'lowpass') {
      const ctx = getAudioCtx();
      if (!ctx || muted) return;
      const bufferSize = Math.floor(ctx.sampleRate * (durationMs / 1000));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = type;
      filter.frequency.value = filterHz;

      const now = ctx.currentTime;
      const dur = durationMs / 1000;
      gain.gain.value = vol * masterVol;
      gain.gain.linearRampToValueAtTime(0.0001, now + dur + 0.06);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + dur + 0.1);
    }

    // === CANONICAL WRAPPERS (use these exact calls for world continuity) ===
    function playJump() {
      if (muted) return;
      playTone(620, 72, 'square', 0.18, 6, 70);
      setTimeout(() => playTone(880, 38, 'sine', 0.09, 4, 30), 18);
    }
    function playTrampoline() {
      if (muted) return;
      playTone(780, 95, 'triangle', 0.20, 7, 90);
      setTimeout(() => playTone(1050, 55, 'sine', 0.11, 5, 45), 22);
    }
    function playLand() {
      if (muted) return;
      playTone(280, 55, 'sine', 0.12, 5, 55);
      playNoise(48, 0.06, 900, 'lowpass');
    }
    function playCollect(isGreen = false) {
      if (muted) return;
      const base = isGreen ? 720 : 880;
      playTone(base, 42, 'triangle', 0.22, 3, 35);
      setTimeout(() => playTone(base * 1.25, 42, 'triangle', 0.18, 3, 35), 28);
      setTimeout(() => playTone(base * 1.5, 55, 'sine', 0.14, 4, 40), 55);
      if (isGreen) {
        setTimeout(() => playTone(base * 0.9, 60, 'sine', 0.10, 6, 50), 40);
      }
    }
    function playPowerup(type = 'shield') {
      if (muted) return;
      const isIce = type === 'ice';
      const notes = isIce ? [980, 1120, 1310, 1550] : [820, 980, 1150, 1380];
      notes.forEach((f, i) => {
        setTimeout(() => {
          playTone(f, 65, isIce ? 'triangle' : 'sine', isIce ? 0.17 : 0.19, 5, 55);
        }, i * 22);
      });
      setTimeout(() => playNoise(90, 0.07, isIce ? 2200 : 1600, 'lowpass'), 30);
    }
    function playLadderStep() {
      if (muted) return;
      playTone(920, 38, 'square', 0.09, 3, 32);
      playNoise(32, 0.05, 1400, 'lowpass');
    }
    function playLadderGrab() {
      if (muted) return;
      playTone(410, 75, 'sine', 0.13, 8, 70);
    }
    function playDeath(cause = 'hazard') {
      if (muted) return;
      if (cause === 'drown') {
        // Low, muffled underwater choke — separate from pit lava drown timer
        playTone(210, 200, 'sine', 0.14, 18, 180);
        setTimeout(() => playTone(150, 180, 'triangle', 0.11, 14, 160), 70);
        setTimeout(() => playTone(95, 220, 'sine', 0.09, 20, 200), 140);
        playNoise(280, 0.08, 420, 'lowpass');
        return;
      }
      const base = (cause === 'lava' || cause === 'acid') ? 480 : (cause === 'ptero' || cause === 'ice' ? 780 : 650);
      playTone(base, 160, 'sine', 0.16, 12, 140);
      setTimeout(() => playTone(base * 0.75, 140, 'sine', 0.12, 10, 120), 55);
      if (cause === 'lava' || cause === 'acid') {
        playNoise(220, 0.07, 650, 'lowpass');
      } else if (cause === 'ice' || cause === 'ptero') {
        playNoise(90, 0.05, 2800, 'highpass');
      }
    }
    function playBubbleChirp() {
      if (muted) return;
      playTone(880 + Math.random() * 220, 55, 'sine', 0.08, 4, 48);
      setTimeout(() => playTone(1100 + Math.random() * 180, 40, 'triangle', 0.05, 3, 32), 18);
    }
    function playPortal() {
      if (muted) return;
      playNoise(320, 0.09, 1800, 'lowpass');
      const chimes = [720, 880, 1080, 1320, 1620];
      chimes.forEach((f, i) => {
        setTimeout(() => playTone(f, 180, 'sine', 0.15 + (i === 4 ? 0.04 : 0), 15, 160), i * 18);
      });
    }
    function playIceBlast() {
      if (muted) return;
      [1240, 1380, 1510, 1720].forEach((f, i) => {
        setTimeout(() => playTone(f, 95, 'triangle', 0.18, 4, 80), i * 7);

      initFlyingShips();

    function initBackgroundElements() {
      // Distant coral blooms + midground seaweed stalks (underwater palette; aqua/teal/blue-green)
      backgroundElements = [];
      const spread = 12500;
      const startX = -600;

      for (let i = 0; i < 14; i++) {
        const wx = startX + (i / 14) * spread + (Math.random() - 0.5) * 260;
        const r = Math.random();

        if (r < 0.72) {
          // Large coral bloom stem with layered fronds + glowing center (parallax + phase sway preserved)
          backgroundElements.push({
            type: 'largeBloom',
            wx: wx,
            y: GROUND_Y - 8 - Math.random() * 32,
            scale: 0.9 + Math.random() * 1.25,
            parallax: 0.055 + Math.random() * 0.035,
            phase: Math.random() * Math.PI * 2
          });
        } else {
          // Closer midground seaweed stalk cluster with small fronds / leaves
          backgroundElements.push({
            type: 'midStalk',
            wx: wx + (Math.random() - 0.5) * 120,
            y: GROUND_Y - 22 - Math.random() * 18,
            scale: 0.6 + Math.random() * 0.9,
            parallax: 0.09 + Math.random() * 0.025,
            phase: Math.random() * Math.PI * 2
          });
        }
      }
    }

    function initFlyingShips() {
      // Drifting bubble / silt plumes high in the water column (reduced count)
      flyingShips = [];
      for (let i = 0; i < 6; i++) {
        const wx = -400 + Math.random() * 4800 + i * 580;
        flyingShips.push({
          wx: wx,
          y: 48 + Math.random() * 165,
          vx: -0.65 - Math.random() * 0.85,   // slow leftward drift (traffic)
          scale: 0.55 + Math.random() * 0.9,
          parallax: 0.038 + Math.random() * 0.022
        });
      }
    }

    function spawnDust(x, y, count, leftBias) {
      for (let i = 0; i < count; i++) {
        const sp = 0.8 + Math.random() * 1.8;
        particles.push({
          x: x + (Math.random() - 0.5) * 9,
          y: y + Math.random() * 2,
          vx: (Math.random() - (leftBias ? 0.7 : 0.5)) * sp * 1.4,
          vy: -0.7 - Math.random() * 1.1,
          life: 14 + Math.random() * 11,
          c: '#77bbdd'
        });
      }
    }

    function spawnExplosion(x, y) {
      for (let i = 0; i < 32; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 1.4 + Math.random() * 3.8;
        particles.push({
          x: x + (Math.random() - 0.5) * 6,
          y: y + (Math.random() - 0.5) * 6,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp - 0.6,
          life: 22 + Math.random() * 26,
          c: (Math.random() > 0.6) ? '#88aabb' : '#aaddff'
        });
      }
    }

    function spawnNeonSmoke(x, y, count) {
      // Atmospheric silt / bubble haze in the water column (blue-aqua)
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 28,
          y: y + (Math.random() - 0.5) * 14,
          vx: (Math.random() - 0.5) * 0.7,
          vy: -0.35 - Math.random() * 0.55,   // slow upward drift
          life: 38 + Math.random() * 46,
          c: (Math.random() < 0.3 ? '#33aacc' : '#1a4a6e'),
          size: 1.6 + Math.random() * 1.4
        });
      }
    }

    function spawnIceShards(x, y, count) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 1.4 + Math.random() * 2.8;
        particles.push({
          x: x + (Math.random() - 0.5) * 6,
          y: y + (Math.random() - 0.5) * 6,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp - 0.9,
          life: 24 + Math.random() * 20,
          c: (Math.random() < 0.6 ? '#ddffff' : '#99ccff'),
          size: 1.6 + Math.random() * 1.2
        });
      }
    }

    // === L6 AIR BUBBLES + OXYGEN ===
    function makeAirBubble(wx, y) {
      const r = AIR_BUBBLE_R_MIN + Math.random() * (AIR_BUBBLE_R_MAX - AIR_BUBBLE_R_MIN);
      return {
        wx: wx,
        y: y,
        r: r,
        vx: -0.35 - Math.random() * 0.55,   // slow leftward water drift
        bobAmp: 0.25 + Math.random() * 0.45,
        bobPhase: Math.random() * Math.PI * 2,
        bobSpeed: 0.02 + Math.random() * 0.025,
        baseY: y
      };
    }

    // Circle (bubble) vs player AABB — pass-through gas pocket, not solid
    function playerInsideAirBubble(b) {
      const left = player.wx;
      const right = player.wx + player.w;
      const top = player.y;
      const bottom = player.y + player.h;
      const closestX = Math.max(left, Math.min(b.wx, right));
      const closestY = Math.max(top, Math.min(b.y, bottom));
      const dx = b.wx - closestX;
      const dy = b.y - closestY;
      return (dx * dx + dy * dy) <= (b.r * b.r);
    }

    function spawnAquaDrownBurst(x, y) {
      for (let i = 0; i < 36; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 1.2 + Math.random() * 3.6;
        particles.push({
          x: x + (Math.random() - 0.5) * 8,
          y: y + (Math.random() - 0.5) * 8,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp - 0.8,
          life: 24 + Math.random() * 28,
          c: (Math.random() < 0.45) ? '#66ddff' : ((Math.random() < 0.5) ? '#33aacc' : '#a8e8ff'),
          size: 1.8 + Math.random() * 1.6
        });
      }
    }

    function updateAirBubblesAndOxygen() {
      // Only while actively playing (climb early-return never reaches here → oxygen freezes)
      if (gameState !== 'playing') return;

      // Drift + bob bubbles; prune far off-screen
      for (let i = airBubbles.length - 1; i >= 0; i--) {
        const b = airBubbles[i];
        b.bobPhase += b.bobSpeed;
        b.wx += b.vx;
        b.y = b.baseY + Math.sin(b.bobPhase) * (b.bobAmp * 18);
        // gentle upward float of base so they feel alive
        b.baseY -= 0.08 + Math.random() * 0.04;
        if (b.wx + b.r < scrollX - 140 || b.wx - b.r > scrollX + W + 220 || b.y + b.r < -80 || b.y - b.r > H + 40) {
          airBubbles.splice(i, 1);
        }
      }

      // Very frequent large bubble spawns ahead / around the player
      if (--nextAirBubbleSpawn <= 0 && airBubbles.length < MAX_AIR_BUBBLES) {
        const side = Math.random();
        let wx;
        if (side < 0.55) {
          wx = player.wx + 180 + Math.random() * 320; // ahead
        } else if (side < 0.8) {
          wx = player.wx - 40 + Math.random() * 120; // near player
        } else {
          wx = player.wx + W * 0.55 + Math.random() * 160; // far forward
        }
        const y = 70 + Math.random() * (GROUND_Y - 140); // multi-height
        airBubbles.push(makeAirBubble(wx, y));
        nextAirBubbleSpawn = AIR_BUBBLE_SPAWN_MIN + Math.floor(Math.random() * AIR_BUBBLE_SPAWN_SPAN);
      } else if (airBubbles.length >= MAX_AIR_BUBBLES && nextAirBubbleSpawn <= 0) {
        nextAirBubbleSpawn = AIR_BUBBLE_SPAWN_MIN;
      }

      // Oxygen drain / refill
      let inside = false;
      for (let b of airBubbles) {
        if (playerInsideAirBubble(b)) {
          inside = true;
          break;
        }
      }

      if (inside) {
        if (!wasInsideAirBubble) playBubbleChirp();
        oxygen = Math.min(OXYGEN_MAX, oxygen + OXYGEN_REFILL);
        // Soft refill chirp occasionally while breathing in bubble
        if ((frame % 28) === 0) playBubbleChirp();
      } else {
        oxygen = Math.max(0, oxygen - OXYGEN_DRAIN);
      }
      wasInsideAirBubble = inside;

      if (oxygen <= 0) {
        oxygen = 0;
        gameState = 'over';
        playDeath('drown');
        spawnAquaDrownBurst(player.wx + player.w / 2, player.y + player.h / 2);
        spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
        if (score > best) {
          best = score;
          saveBest();
        }
      }
    }

    function detonateIceBlast() {
      if (!hasIceBlast) return;
      hasIceBlast = false;
      playIceBlast();

      // Big central ice burst at player
      spawnIceShards(player.wx + 13, player.y + 13, 40);

      // Kill every on-screen enemy, triangle (obstacle), and projectile
      const killLists = [
        { arr: obstacles, label: 'triangle' },
        { arr: specials, label: 'enemy' },
        { arr: verticalEnemies, label: 'enemy' },
        { arr: ceilingFlowers, label: 'hazard' },
        { arr: slimePuddles, label: 'hazard' },
        { arr: pteros, label: 'enemy' },
        { arr: projectiles, label: 'projectile' },
        { arr: endFireballs, label: 'projectile' },
        { arr: poisonDarts, label: 'projectile' }
      ];

      for (let list of killLists) {
        for (let i = list.arr.length - 1; i >= 0; i--) {
          const obj = list.arr[i];
          const sx = (obj.wx || 0) - scrollX;
          if (sx > -30 && sx < W + 30) {
            spawnIceShards((obj.wx || 0) + 10, (obj.y || GROUND_Y - 30) + 10, 8);
            list.arr.splice(i, 1);
          }
        }
      }
    }

    function checkCollision(p, o) {
      const ox = getTriangleCurrentWX(o);
      const oh = o.h;
      const triLeft = ox - 14;
      const triRight = ox + 14;
      const triTop = GROUND_Y - oh;

      const pLeft = p.wx;
      const pRight = p.wx + p.w;
      const pTop = p.y;
      const pBottom = p.y + p.h;

      // x overlap
      if (pRight < triLeft || pLeft > triRight) return false;

      // if cube bottom is low enough to hit the triangle body
      if (pBottom > triTop + 3) {
        // rough center check for the slope area
        const mid = (triLeft + triRight) / 2;
        const dx = Math.abs((pLeft + pRight) / 2 - mid);
        const allowedExtra = (oh / 2.4);
        if (dx < 11 + allowedExtra) return true;
      }
      return false;
    }

    // Ensures lava traps (waterGaps), triangle obstacles, lowWalls and trampolines
    // never spawn on top of (overlapping x-ranges) or directly beside each other.
    // Edge-to-edge min distance enforced (60px: player w~26 + margin).
    // Used before any obs or waterGap push (and for consistency in low/tramp).
    // Checks against ALL of the relevant existing arrays; bidirectional.
    function wouldBeTooCloseToHazards(newLeft, newRight, minSep) {
      // vs waterGaps (lava/acid pits)
      for (let g of waterGaps) {
        const gLeft = g.wx;
        const gRight = g.wx + g.width;
        const dist = Math.max(0, Math.max(newLeft - gRight, gLeft - newRight));
        if (dist < minSep) return true;
      }
      // vs obstacles (ground triangles) - use accurate collision width
      for (let o of obstacles) {
        const oPatrol = (o.patrolAmp || 0);
        const oLeft = o.wx - 14 - oPatrol;
        const oRight = o.wx + 14 + oPatrol;
        const dist = Math.max(0, Math.max(newLeft - oRight, oLeft - newRight));
        if (dist < minSep) return true;
      }
      // vs lowWalls (for consistency)
      for (let w of lowWalls) {
        const wLeft = w.wx;
        const wRight = w.wx + (w.width || 20);
        const dist = Math.max(0, Math.max(newLeft - wRight, wLeft - newRight));
        if (dist < minSep) return true;
      }
      // vs trampolines (prevent new hazards directly under/beside)
      for (let t of trampolines) {
        const tLeft = t.wx;
        const tRight = t.wx + (t.width || 40);
        const dist = Math.max(0, Math.max(newLeft - tRight, tLeft - newRight));
        if (dist < minSep) return true;
      }
      return false;
    }

    function getTriangleCurrentWX(o) {
      if (!o.patrolAmp || o.patrolAmp < 1) return o.wx;
      const rate = o.patrolRate || 0.006;
      const t = frame * rate + (o.patrolPhase || 0);
      return o.wx + o.patrolAmp * Math.sin(t);
    }
    function computeSafeTrianglePatrolAmp(baseWX, triHalf, waterGaps, lowWalls, trampolines, obstacles) {
      // Find nearest left land bound from waterGaps (gRight <= base)
      let leftBound = -9999;
      for (let g of waterGaps) {
        const gRight = g.wx + g.width;
        if (gRight <= baseWX + 1) leftBound = Math.max(leftBound, gRight);
      }
      // Nearest right
      let rightBound = 99999;
      for (let g of waterGaps) {
        const gLeft = g.wx;
        if (gLeft >= baseWX - 1) rightBound = Math.min(rightBound, gLeft);
      }
      const MARGIN = 25;
      leftBound = leftBound + MARGIN + triHalf;
      rightBound = rightBound - MARGIN - triHalf;
      // Also vs other ground hazards conservative (include their patrol if present)
      for (let o of obstacles) {
        const op = (o.patrolAmp || 0);
        const oL = o.wx - 14 - op;
        const oR = o.wx + 14 + op;
        if (oR < baseWX) leftBound = Math.max(leftBound, oR + 8);
        if (oL > baseWX) rightBound = Math.min(rightBound, oL - 8);
      }
      for (let w of lowWalls) {
        const wR = w.wx + (w.width || 20);
        if (wR < baseWX) leftBound = Math.max(leftBound, wR + 8);
      }
      for (let t of trampolines) {
        const tR = t.wx + (t.width || 40);
        if (tR < baseWX) leftBound = Math.max(leftBound, tR + 8);
      }
      let amp = Math.min(baseWX - leftBound, rightBound - baseWX);
      amp = Math.min(Math.max(amp, 0), 13);
      if (amp < 4) amp = 0;
      return amp;
    }

    function update() {
      if (gameState !== 'playing') return;

      frame++;

      // movement input with smoothing + slight auto-advance bias
      let ax = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) ax -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) ax += 1;

      player.vx = player.vx * 0.78 + ax * 5.4 * 0.22;

      // gentle forward bias so the run keeps going
      if (ax >= 0) player.vx += 0.055;

      player.vx = Math.max(-3.2, Math.min(5.4, player.vx));
      player.wx += player.vx;

      // Ice blast detonation (down arrow) - single use, kills onscreen enemies/triangles/projectiles
      if (keys['ArrowDown'] && hasIceBlast && gameState === 'playing') {
        detonateIceBlast();
        keys['ArrowDown'] = false;
      }

      // clamp left bound
      if (player.wx < 40) {
        player.wx = 40;
        player.vx = Math.max(0, player.vx);
      }

      // === LOW WALL / BARRIER COLLISION (blocks movement but does not kill - must jump over) ===
      for (let wall of lowWalls) {
        const wallLeft = wall.wx;
        const wallRight = wall.wx + wall.width;
        const wallTop = GROUND_Y - wall.height;

        if (player.wx + player.w > wallLeft && player.wx < wallRight) {
          if (player.y + player.h > wallTop) {
            // Player is too low - block horizontally
            if (player.vx > 0) {
              player.wx = wallLeft - player.w - 0.5;
            } else if (player.vx < 0) {
              player.wx = wallRight + 0.5;
            }
            player.vx = 0;
          }
        }
      }

      // Compute if currently over a lava pit (for physics, landing, etc.)
      let overWaterGap = false;
      for (let gap of waterGaps) {
        if (player.wx + player.w > gap.wx && player.wx < gap.wx + gap.width) {
          overWaterGap = true;
          break;
        }
      }

      // Reset lava exposure state if player is no longer over a pit
      if (!overWaterGap) {
        player.drowningStart = 0;
      }

      // === VERTICAL ENEMY COLLISION (deadly up/down aliens) ===
      for (let e of verticalEnemies) {
        const ex = e.wx;
        const ey = e.y;
        // Simple AABB for the creature body
        if (player.wx + player.w > ex - 14 && player.wx < ex + 14 &&
            player.y + player.h > ey - 18 && player.y < ey + 18) {
          gameState = 'over';
          playDeath('hazard');
          spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
          break;
        }
      }

      // === CEILING SEAWEED FROND HAZARD COLLISION (whole extended vine deadly; watery theme hazard)
      // Use simple generous AABB over current length (wiggle considered by extra x margin); touch any part of extended vine = die
      for (let f of ceilingFlowers) {
        const fTop = f.baseY;
        const fBottom = f.baseY + f.length;
        const thick = 18; // vine thickness for hit + wiggle allowance (~ length*0.08 sway)
        const fLeft = f.wx - thick;
        const fRight = f.wx + thick;
        if (player.wx + player.w > fLeft && player.wx < fRight &&
            player.y + player.h > fTop && player.y < fBottom) {
          gameState = 'over';
          playDeath('hazard');
          spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
          // aqua frond / bubble burst on seaweed vine death (theme)
          for (let k = 0; k < 11; k++) {
            const ang = Math.random() * Math.PI * 2;
            const sp = 1.1 + Math.random() * 2.4;
            particles.push({
              x: f.wx,
              y: f.baseY + Math.min(f.length * 0.6, f.length - 10),
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp - 0.8,
              life: 16 + Math.random() * 12,
              c: (Math.random() < 0.6 ? '#33aacc' : '#66ddff'),
              size: 1.6 + Math.random() * 0.8
            });
          }
          break;
        }
      }

      // === LAVA PTERO COLLISION (flying reptile birds - AABB hit kills player unless shield/invuln; reuse logic)
      for (let i = pteros.length - 1; i >= 0; i--) {
        const p = pteros[i];
        const pLeft = p.wx;
        const pRight = p.wx + 28;
        const pTop = p.y - 6;
        const pBottom = p.y + 14;
        const playerLeft = player.wx;
        const playerRight = player.wx + player.w;
        const playerTop = player.y;
        const playerBottom = player.y + player.h;
        if (playerRight > pLeft && playerLeft < pRight && playerBottom > pTop && playerTop < pBottom) {
          const now = frame;
          if (now < player.invulnUntil) {
            // protected
          } else if (player.hasShield) {
            player.hasShield = false;
            playShieldPop();
            player.invulnUntil = now + 300;
            for (let k = 0; k < 18; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.6 + Math.random() * 3.0;
              particles.push({
                x: player.wx + 13, y: player.y + 13,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.6,
                life: 26 + Math.random() * 16, c: '#33aacc', size: 1.8
              });
            }
          } else {
            gameState = 'over';
            playDeath('ptero');
            spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
          }
          pteros.splice(i, 1);
          break;
        }
      }

      // Water/ink orb collision (deadly erupting blue orbs from water pits)
      for (let i = poisonDarts.length - 1; i >= 0; i--) {
        const dart = poisonDarts[i];
        if (player.wx + player.w > dart.wx - 4 && player.wx < dart.wx + 4 &&
            player.y + player.h > dart.y - 3 && player.y < dart.y + 9) {
          const now = frame;
          if (now < player.invulnUntil) {
            // Fully protected during 5-second post-shield grace period
            poisonDarts.splice(i, 1);
          } else if (player.hasShield) {
            player.hasShield = false;
            playShieldPop();
            player.invulnUntil = now + 300; // 5 seconds invulnerability after shield pops
            for (let k = 0; k < 22; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.8 + Math.random() * 3.2;
              particles.push({
                x: player.wx + 13, y: player.y + 13,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.7,
                life: 28 + Math.random() * 18, c: '#66ddff', size: 2.0
              });
            }
            poisonDarts.splice(i, 1);
          } else {
            gameState = 'over';
            playGooPop();
            playDeath('lava');
            spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
            poisonDarts.splice(i, 1);
            break;
          }
        }
      }

      // === INVISIBLE BARRIER AT LEVEL END (prevents running past the ladder) ===
      if (levelExit) {
        const maxWX = levelExit.wx + 14;
        if (player.wx > maxWX) {
          player.wx = maxWX;
          player.vx = 0;
        }
      }

      // === VISIBLE LADDER CLIMB (executes only when triggered; ends level at portal) ===
      if (player.isClimbing && gameState === 'playing') {
        player.climbProgress = (player.climbProgress || 0) + 0.0198;
        if ((frame % 7) === 0) playLadderStep();
        const t = Math.min(1, player.climbProgress);

        if (levelExit) {
          if (player.climbStartY === undefined) player.climbStartY = player.y;
          if (player.climbTargetY === undefined) player.climbTargetY = levelExit.baseY - 305; // tall portal (60%+ of level height)

          player.y = player.climbStartY + (player.climbTargetY - player.climbStartY) * t;
          player.wx = levelExit.wx - 4; // stick to ladder center for nice visual climb
        }

        player.vx = 0;
        player.vy = 0;

        // Keep camera smoothly following the player as they climb
        const ctarget = player.wx - 275;
        scrollX += (ctarget - scrollX) * 0.12;  // snappier follow (reduced perceived lag after theme draw cost)

        if (t >= 1) {
          player.isClimbing = false;
          gameState = 'complete';
          playPortal();
          updateLevel3LinkVisibility();  // explicit on transition (perf: no longer in every gameLoop frame)

          // Final portal touch burst (only ends when player reaches top)
          const ex = player.wx + 13;
          const ey = player.y + 8;
          for (let i = 0; i < 24; i++) {
            const ang = Math.random() * Math.PI * 2;
            const sp = 0.85 + Math.random() * 2.35;
            particles.push({
              x: ex,
              y: ey,
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp - 0.95,
              life: 30 + Math.random() * 24,
              c: '#66ddff',
              size: 2.1
            });
          }
        }
        return; // skip normal gameplay (spawns, collisions, etc.) during climb sequence
      }

      // vertical physics
      let gravity = 0.47;
      if (overWaterGap) {
        gravity = 0.22; // slightly slower fall through toxic vat than through air
      }
      player.vy += gravity;
      player.y += player.vy;

      // === Robust landing resolution (fixes invisible platform floating bug) ===
      // Every frame we explicitly test "is the player currently standing on ground or any platform?"
      let landed = false;
      let targetY = player.y;

      let platDeltaX = 0;

      // Ground support - do not land if over a lava pit (must fall down the pit)
      if (!overWaterGap && player.y + player.h >= GROUND_Y - 0.5) {
        targetY = GROUND_Y - player.h;
        landed = true;
      }

      // Platform support - find the highest (lowest y) surface we are on top of
      // (swaying platforms use animated x position for both physics and visuals; floating use y offset)
      for (let p of platforms) {
        const sway = (p.swayAmp || 0) * Math.sin((frame * 0.021) + (p.swayPhase || 0));
        const floatY = (p.floatAmp || 0) * Math.sin((frame * 0.018) + (p.floatPhase || 0));
        const platSurface = p.y + floatY - player.h;
        const platLeft = p.wx + sway;
        const platRight = p.wx + sway + p.width;
        const pLeft = player.wx;
        const pRight = player.wx + player.w;

        // Proper x overlap + feet near or on the platform top (use animated y)
        if (pRight > platLeft && pLeft < platRight) {
          const feet = player.y + player.h;
          const yAnim = p.y + floatY;
          if (feet >= yAnim - 2 && player.y <= yAnim + 5) {
            if (platSurface < targetY) { // higher platform wins
              targetY = platSurface;
              landed = true;
              const amp = (p.swayAmp || 0);
              const phase = (p.swayPhase || 0);
              const omega = 0.021;
              const currSway = amp * Math.sin((frame * omega) + phase);
              const prevSway = amp * Math.sin(((frame - 1) * omega) + phase);
              platDeltaX = currSway - prevSway;
            }
          }
        }
      }

      if (landed) {
        player.y = targetY;
        player.vy = 0;
        player.wx += platDeltaX;
        if (Math.abs(platDeltaX) > 0.0001) {
          player.vx *= 0.8;
        }
      }

      // === OVAL TRAMPOLINE BOOST (gives super jump just before tall walls) ===
      for (let t of trampolines) {
        const tLeft = t.wx;
        const tRight = t.wx + t.width;
        const tTop = GROUND_Y - 6;

        if (player.wx + player.w > tLeft && player.wx < tRight) {
          const feet = player.y + player.h;
          // Only boost when landing on or crossing the trampoline from above
          if (feet >= tTop - 2 && player.vy >= 0) {
            player.vy = -19.5;   // Much stronger upward boost than normal jump
            landed = true;
            player.y = tTop - player.h - 1;
            playTrampoline();
            // Fun bounce particles
            for (let i = 0; i < 7; i++) {
              particles.push({
                x: player.wx + 8 + (Math.random() - 0.5) * 18,
                y: tTop,
                vx: (Math.random() - 0.5) * 2.8,
                vy: -1.8 - Math.random() * 1.4,
                life: 18 + Math.random() * 12,
                c: '#66ffdd',
                size: 2.2
              });
            }
          }
        }
      }

      // Land sound after full landing resolution (ground + platforms + trampoline)
      if (landed && wasAirborne) {
        playLand();
      }
      wasAirborne = !landed;

      // jump (only when on ground or a platform)
      if ((keys[' '] || keys['Spacebar']) && landed && player.vy >= -0.1) {
        player.vy = -11.8;
        jumpCount++;
        spawnDust(player.wx + 8, player.y + player.h + 1, 7, true);
        playJump();
        wasAirborne = true;
        keys[' '] = false; // one-shot
      }

      // Slow fall and eventual death when falling into lava pits (not solid)
      // Player must fall down the pit; falls slightly slower than sky
      if (overWaterGap && player.y + player.h > GROUND_Y - 2) {
        // already handled slower gravity in vertical physics
        player.vx *= 0.6;

        if (!player.drowningStart) {
          player.drowningStart = frame;
        }

        // Die only after falling into the lava for a while (sinking / burning)
        if (frame - player.drowningStart > 65) {
          gameState = 'over';
          playDeath('lava');
          spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
        }
      }

      // camera follow (smooth, with forward lead)
      const target = player.wx - 275;
      scrollX += (target - scrollX) * 0.12;  // snappier follow (reduced perceived lag)

      // === SPAWN: triangular ground hazards (patrol safely L/R; spaced out more for longer level) ===
      if (player.wx > lastSpawnWX - 140) {
        const gap = 570 + Math.random() * 390;
        const nextWX = lastSpawnWX + gap;
        const oh = 20 + Math.random() * 29;
        const triW = 28; // accurate to collision/draw (centered -14/+14)
        const triLeft = nextWX - triW / 2;
        const triRight = nextWX + triW / 2;
        // Strict pre-push check using unified helper: against ALL waterGaps, obstacles, lowWalls, trampolines.
        // Enforces edge-to-edge >=60px separation (player ~26 + margin). Prevents "on top" (significant x-overlap considering widths)
        // or "directly beside" (edge dist < minSep). Also covers same-type (tri vs tri) + bidirectional.
        // (Replaces prior weak +/-10 overlap; now robust + also vs other triangles/lowWalls for full consistency.)
        let safe = !wouldBeTooCloseToHazards(triLeft, triRight, 60);
        if (safe) {
          const amp = computeSafeTrianglePatrolAmp(nextWX, 14, waterGaps, lowWalls, trampolines, obstacles);
          obstacles.push({ wx: nextWX, h: oh, patrolAmp: amp, patrolPhase: Math.random()*Math.PI*2, patrolRate: 0.0065 });
          lastSpawnWX = nextWX;
        } else {
          // advance anyway to not get stuck
          lastSpawnWX = nextWX;
        }
      }

      // === SPAWN: floating platforms (optional safe landings) - much more frequent now ===
      if (player.wx > lastPlatWX - 260) {
        if (Math.random() < 0.78) {
          const platWX = lastPlatWX + 38 + Math.random() * 95;
          const platY = GROUND_Y - (58 + Math.random() * 105);
          // Varied lengths: mostly short/medium, occasional long ones
          let platW = 38 + Math.random() * 48;
          if (Math.random() < 0.22) platW = 95 + Math.random() * 85; // longer platforms sometimes

          // Prevent new platforms from spawning on top of or touching the ending ladder
          let canSpawn = true;
          if (levelExit) {
            const ladderCenter = levelExit.wx;
            const platCenter = platWX + platW / 2;
            if (Math.abs(platCenter - ladderCenter) < 100 && platY > GROUND_Y - 420) {
              canSpawn = false;
            }
          }

          // New rule: Trampolines must never have a platform directly above them
          if (canSpawn) {
            for (let t of trampolines) {
              const tCenter = t.wx + (t.width || 40) / 2;
              const pCenter = platWX + platW / 2;
              if (Math.abs(pCenter - tCenter) < 42) {
                canSpawn = false;
                break;
              }
            }
          }

          // Also avoid spawning platforms on water pits
          if (canSpawn) {
            for (let g of waterGaps) {
              const pCenter = platWX + platW / 2;
              const gCenter = g.wx + g.width / 2;
              if (Math.abs(pCenter - gCenter) < (platW / 2 + g.width / 2 + 5)) {
                canSpawn = false;
                break;
              }
            }
          }

          if (canSpawn) {
            // Some platforms sway slowly side-to-side (underwater drift); more now for variety
            const swayAmp = Math.random() < 0.65 ? (22 + Math.random() * 52) : 0;
            const swayPhase = Math.random() * Math.PI * 2;
            // New: some float up/down (vertical bob) for watery feel; ~28% get float (allow overlap with sway for some that do both)
            let floatAmp = 0;
            let floatPhase = 0;
            if (Math.random() < 0.28) {
              floatAmp = 18 + Math.random() * 25;
              floatPhase = Math.random() * Math.PI * 2;
            }
            platforms.push({ wx: platWX, y: platY, width: platW, height: 13, swayAmp, swayPhase, floatAmp, floatPhase });
          }
        }
        lastPlatWX = lastPlatWX + 145 + Math.random() * 70;
      }

      // === SPAWN: low walls / barriers (occasional - player must jump over) + trampolines ===
      if (player.wx > lastWallWX - 420) {
        if (Math.random() < 0.48) {
          const wallWX = lastWallWX + 55 + Math.random() * 95;
          const wallW = 16 + Math.random() * 8;
          const wallLeft = wallWX;
          const wallRight = wallWX + wallW;
          // Strengthened with unified helper (60px edge sep vs lava/tris/obstacles + bidirectional)
          let wallCanSpawn = !wouldBeTooCloseToHazards(wallLeft, wallRight, 60);
          if (wallCanSpawn) {
            // Walls are now 5x taller to be a real challenge
            const wallH = 85 + Math.random() * 60;
            lowWalls.push({ wx: wallWX, height: wallH, width: wallW });

            // Spawn oval trampoline just before the wall to give a big boost
            // (tramp intentionally close to its wall; helper ensures tramp not too close to other hazards)
            let trampCanSpawn = true;
            const tWX = wallWX - 72 - Math.random() * 18;
            const tW = 36 + Math.random() * 8;
            const tLeft = tWX;
            const tRight = tWX + tW;
            trampCanSpawn = !wouldBeTooCloseToHazards(tLeft, tRight, 60);
            if (trampCanSpawn) {
              trampolines.push({
                wx: tWX,
                width: tW
              });
            }
          }
        }
        // Always advance the spawn timer every time we enter the "consider spawning" block (original behavior)
        lastWallWX = lastWallWX + 320 + Math.random() * 140;
      }

      // === SPAWN: blue water pits (deadly if fallen into; L6 watery reskin) ===
      if (!levelExit && player.wx > 600 && Math.random() < 0.012) {
        const gapW = 60 + Math.random() * 52.5; // ~25% larger, still jumpable
        const gapWX = player.wx + 320 + Math.random() * 180;

        const gapLeft = gapWX;
        const gapRight = gapWX + gapW;
        // Unified/strengthened pre-push separation (replaces scattered tooClose blocks): Use robust helper
        // for checks vs ALL existing waterGaps + obstacles + lowWalls + tramps at 60px min edge-to-edge.
        // This covers triangles vs lava/acid (both directions), same-type, on-top (overlap) or directly beside.
        // Then ADDITIONAL stricter gap-vs-gap at original 78px (to preserve exact difficulty curve / spacing).
        let tooClose = wouldBeTooCloseToHazards(gapLeft, gapRight, 60);
        if (!tooClose) {
          // Ensure minimum distance between gaps (edge to edge) is at least 3x player width = 78px (original behavior preserved exactly)
          for (let g of waterGaps) {
            const existingRight = g.wx + g.width;
            const newLeft = gapWX;
            const distBetween = newLeft - existingRight;
            if (distBetween < 78 && distBetween > - (gapW + 10)) { // allow some ordering
              tooClose = true;
              break;
            }
            // Check the other way too
            const distOther = g.wx - (gapWX + gapW);
            if (distOther < 78 && distOther > - (g.width + 10)) {
              tooClose = true;
              break;
            }
          }
        }

        if (!tooClose) {
          waterGaps.push({ wx: gapWX, width: gapW });

          // Spawn a silt/bubble plume above the water pit
          poisonClouds.push({
            wx: gapWX + gapW / 2,
            y: 55 + Math.random() * 35, // high in sky
            width: 38 + Math.random() * 12,
            lastDart: frame,
            gapWX: gapWX,
            gapWidth: gapW
          });
        }
      }

      // === SPAWN: rocky outcrops / lava vents in midground (for parallax) ===
      if (player.wx > 400 && Math.random() < 0.009) {
        const treeWX = player.wx + 350 + Math.random() * 300;
        alienTrees.push({
          wx: treeWX,
          y: GROUND_Y - 35 - Math.random() * 25,
          scale: 0.7 + Math.random() * 0.6,
          parallax: 0.07 + Math.random() * 0.03
        });
      }

      // === SPAWN: special chasing aqua bio-shooter (fins/tentacles, slightly increased frequency) ===
      if (frame - lastSpecialFrame > 1380 && Math.random() < 0.039) {
        const spawnWX = Math.max(player.wx + 360, scrollX + W + 40) + Math.random() * 160;
        // Ensure specials do not spawn on acid vats or on trampolines
        let safe = true;
        for (let g of waterGaps) {
          if (spawnWX + 30 > g.wx && spawnWX < g.wx + g.width) {
            safe = false;
            break;
          }
        }
        if (safe) {
          for (let t of trampolines) {
            if (spawnWX + 30 > t.wx && spawnWX < t.wx + (t.width || 40)) {
              safe = false;
              break;
            }
          }
        }
        if (safe) {
          specials.push({
            wx: spawnWX,
            y: GROUND_Y - 64,
            w: 30,
            h: 64,
            nextShot: frame + 70 + Math.random() * 70   // first shot after a short delay
          });
          // (firstSpecial tutorial enemy spawn removed)
          lastSpecialFrame = frame;
        }
      }

      // === SPAWN: vertical moving aliens (less frequent, up/down patrollers with long tails) ===
      if (!levelExit && frame - (window.lastVertEnemySpawn || 0) > 2100 && Math.random() < 0.028) {
        const vwx = player.wx + 420 + Math.random() * 160;
        const baseY = GROUND_Y - 55;
        // Ensure vertical enemies do not spawn on acid vats or on trampolines
        let safe = true;
        for (let g of waterGaps) {
          if (vwx + 14 > g.wx && vwx - 14 < g.wx + g.width) {
            safe = false;
            break;
          }
        }
        if (safe) {
          for (let t of trampolines) {
            if (vwx + 14 > t.wx && vwx - 14 < t.wx + (t.width || 40)) {
              safe = false;
              break;
            }
          }
        }
        if (safe) {
          verticalEnemies.push({
            wx: vwx,
            y: baseY,
            baseY: baseY,
            amplitude: 38 + Math.random() * 18,
            speed: 0.045 + Math.random() * 0.025,
            phase: Math.random() * Math.PI * 2
          });
        }
        window.lastVertEnemySpawn = frame;
      }

      // === SPAWN: blue-green seaweed ceiling hazards (L6 watery; extend slowly downward; whole vine deadly) ===
      // Spawn occasionally ahead (not during end), y near ceiling, initial length 0, maxLength < H/2 (~240), extendRate slow.
      // WigglePhase for snake curve. Safe guards: avoid close to levelExit/ladder, platforms (x), other verticals/ceilingFlowers.
      if (!levelExit && frame % 95 === 0 && Math.random() < 0.045) {
        const spawnWX = player.wx + 380 + Math.random() * 220;
        const baseY = 28 + Math.random() * 32; // near ceiling, top of screen
        let safe = true;
        // Guard vs imminent ladder/end
        if (levelExit && Math.abs(spawnWX - levelExit.wx) < 130) safe = false;
        // Avoid overlap with platforms (prevent visual/platform cross + bad spawns)
        if (safe) {
          for (let p of platforms) {
            if (Math.abs(p.wx - spawnWX) < 92) {
              safe = false;
              break;
            }
          }
        }
        // Avoid other high hazards (verticals, pteros, existing ceiling flowers)
        if (safe) {
          for (let e of verticalEnemies) {
            if (Math.abs(e.wx - spawnWX) < 85) { safe = false; break; }
          }
        }
        if (safe) {
          for (let pr of pteros) {
            if (Math.abs(pr.wx - spawnWX) < 80) { safe = false; break; }
          }
        }
        if (safe) {
          for (let cf of ceilingFlowers) {
            if (Math.abs(cf.wx - spawnWX) < 70) { safe = false; break; }
          }
        }
        if (safe) {
          ceilingFlowers.push({
            wx: spawnWX,
            baseY: baseY,
            length: 0,
            maxLength: 160 + Math.random() * 78, // keep < ~H/2 = 260, "just shorter than half of the vertical distance of the screen"
            extendRate: 0.68 + Math.random() * 0.32,
            wigglePhase: Math.random() * Math.PI * 2
          });
        }
      }

      // === SPAWN: aqua submersible drones (ptero array reused; gliding high; laser bolt)
      // Spawn ~4-6 per level, not too frequent. Use lastPteroSpawn. Spawn from right (mostly) or left.
      // Gliding: slow vx negative, y around 50-100 with sin oscillation for natural glide/bob.
      if (player.wx > 520 && frame - lastPteroSpawn > 610 && Math.random() < 0.055) {
        const fromRight = Math.random() < 0.78;
        const pwx = fromRight ? (scrollX + W + 60 + Math.random() * 40) : (scrollX - 100 - Math.random() * 40);
        const pvx = fromRight ? (-1.05 - Math.random() * 0.65) : (1.05 + Math.random() * 0.65);
        const py = 52 + Math.random() * 48;
        pteros.push({
          wx: pwx,
          y: py,
          vx: pvx,
          phase: Math.random() * Math.PI * 2,
          nextSpit: frame + 110 + Math.random() * 90
        });
        lastPteroSpawn = frame;
      }

      // move specials toward player with lag (slow, jumpable)
      // They change direction instead of walking over acid vats
      for (let s of specials) {
        const desired = player.wx - 6;
        const diff = desired - s.wx;
        if (Math.abs(diff) > 0.8) {
          let move = Math.sign(diff) * 1.28;
          let tentative = s.wx + move;
          let onGap = false;
          for (let g of waterGaps) {
            if (tentative + s.w > g.wx && tentative < g.wx + g.width) {
              onGap = true;
              break;
            }
          }
          if (onGap) {
            // merely change direction
            s.wx -= move * 2;
          } else {
            s.wx = tentative;
          }
        }
        // keep them from going below ground visually
        if (s.y < GROUND_Y - s.h) s.y = GROUND_Y - s.h;
      }

      // === MONSTER GUNFIRE: projectiles from aqua bio-shooters (ink/water orbs) ===
      // Monsters now fire directly toward the player's position at the moment of shooting (non-homing after fired)
      for (let s of specials) {
        if (typeof s.nextShot !== 'number') s.nextShot = frame + 60;

        if (frame >= s.nextShot) {
          const onScreen = (s.wx - scrollX > -60 && s.wx - scrollX < W + 60);
          if (onScreen) {
            // Aim at player, but restricted: only shoot in front of them and diagonally upwards (never straight up or backwards)
            const targetX = player.wx + player.w * 0.5;
            const targetY = player.y + player.h * 0.5;

            let dx = targetX - (s.wx + 8);
            let dy = targetY - (s.y + s.h * 0.38);  // aim from mid-upper body (taller enemies)

            const face = Math.sign(player.wx - (s.wx + 8)) || 1;

            // Force forward only (never shoot behind)
            if (Math.sign(dx) !== face && Math.abs(dx) > 4) {
              dx = face * Math.max(28, Math.abs(dx));
            }

            // Prevent direct upwards: require a decent forward horizontal component when shooting up
            if (dy < -4 && Math.abs(dx) < Math.abs(dy) * 0.62) {
              dx = face * Math.abs(dy) * 0.62;
            }

            const dist = Math.sqrt(dx * dx + dy * dy) || 1;

            const speed = 2.35 + Math.random() * 0.55; // fairly slow projectiles

            projectiles.push({
              wx: s.wx + 8,
              y: s.y + s.h * 0.38,  // fire from mid-upper body (taller enemies)
              vx: (dx / dist) * speed,
              vy: (dy / dist) * speed,
              life: 105 + Math.random() * 18
            });
            playLaser();
          }
          // Randomised fairly slow interval between shots (roughly 1.6s – 3.2s)
          s.nextShot = frame + 95 + Math.random() * 95;
        }
      }

      // Ambient volcanic ash haze (atmospheric, slow rising)
      if (frame % 26 === 0 && Math.random() < 0.75) {
        const smokeBaseX = scrollX + 140 + Math.random() * (W * 0.75);
        const smokeY = GROUND_Y - 25 - Math.random() * 155;
        spawnNeonSmoke(smokeBaseX, smokeY, 1 + Math.random() * 2.2);
      }

      // prune old objects
      obstacles = obstacles.filter(o => o.wx > scrollX - 90);
      platforms = platforms.filter(p => p.wx > scrollX - 130);
      specials = specials.filter(s => s.wx > scrollX - 140);
      lowWalls = lowWalls.filter(w => w.wx > scrollX - 110);
      trampolines = trampolines.filter(t => t.wx > scrollX - 140);
      endFireballs = endFireballs.filter(f => f.wx > scrollX - 80);
      neonOrbs = neonOrbs.filter(o => o.wx > scrollX - 90);
      if (icePowerUp && icePowerUp.wx < scrollX - 90) icePowerUp = null;
      waterGaps = waterGaps.filter(g => g.wx > scrollX - 150);
      alienTrees = alienTrees.filter(t => t.wx > scrollX - 200);
      verticalEnemies = verticalEnemies.filter(e => e.wx > scrollX - 120);
      ceilingFlowers = ceilingFlowers.filter(f => f.wx > scrollX - 120);
      poisonClouds = poisonClouds.filter(c => c.wx > scrollX - 100);
      poisonDarts = poisonDarts.filter(d => d.y < GROUND_Y + 80); // slimeballs can fly up then fall; prune far outliers
      slimePuddles = slimePuddles.filter(p => p.life > 0 && p.wx > scrollX - 150);
      pteros = pteros.filter(p => p.wx > scrollX - 160 && p.wx < scrollX + W + 160); // offscreen prune left or far right

      // Move boss fireballs (they have slight gravity feel)
      for (let i = endFireballs.length - 1; i >= 0; i--) {
        const fb = endFireballs[i];
        fb.wx += fb.vx;
        fb.y += fb.vy;
        fb.vy += 0.035;   // gentle arc downward
        if (fb.y > GROUND_Y - 10) {
          // splat into puddle if hit ground (slimeball effect)
          playGooPop();
          slimePuddles.push({ wx: fb.wx, y: GROUND_Y, life: 300, size: 16 });
          endFireballs.splice(i, 1);
        }
      }

      // Update short-lived slime puddles (fade after ~5s / 300 frames)
      for (let i = slimePuddles.length - 1; i >= 0; i--) {
        if (--slimePuddles[i].life <= 0) slimePuddles.splice(i, 1);
      }

      // Move vertical enemies (up and down in place)
      for (let e of verticalEnemies) {
        e.y = e.baseY + Math.sin(frame * e.speed + e.phase) * e.amplitude;
      }

      // Extend seaweed ceiling fronds slowly (main "tries to get the player" behavior); no full retract, hold at max or pulse lightly
      for (let f of ceilingFlowers) {
        if (f.length < f.maxLength) {
          f.length += f.extendRate;
        }
        // (wiggle offset computed live in draw using frame + phase; slight natural extension only)
      }

      // Move & animate drones (ptero array reused; glide + y bob; laser bolt instead of downward spit; projectiles reused)
      for (let i = pteros.length - 1; i >= 0; i--) {
        const p = pteros[i];
        p.wx += p.vx;
        // y glide bob
        const bob = Math.sin(frame * 0.032 + p.phase) * 7;
        p.y = 52 + ((p.phase * 17) % 48) + bob;
        // occasional spit (downward fireballs, reuse projectiles array + style)
        if (frame >= p.nextSpit) {
          const onScreen = (p.wx - scrollX > -40 && p.wx - scrollX < W + 40);
          if (onScreen) {
            projectiles.push({
              wx: p.wx + 12,
              y: p.y + 8,
              vx: (Math.random() - 0.5) * 0.4,
              vy: 2.2 + Math.random() * 0.9,
              life: 95 + Math.random() * 25
            });
            playPteroSpit();
            // spit embers
            for (let k = 0; k < 5; k++) {
              particles.push({
                x: p.wx + 12,
                y: p.y + 8,
                vx: (Math.random() - 0.5) * 1.2,
                vy: 0.8 + Math.random() * 0.6,
                life: 12 + Math.random() * 8,
                c: (Math.random() < 0.6 ? '#33aacc' : '#66ddff'),
                size: 1.4 + Math.random()
              });
            }
          }
          p.nextSpit = frame + 110 + Math.random() * 90;
        }
        // offscreen prune inside loop
        if (p.wx < scrollX - 160 || p.wx > scrollX + W + 160) {
          pteros.splice(i, 1);
        }
      }

      // Slimeball pop-up logic - from time to time a slimeball erupts upward from the slime pit then falls back in (deadly hazard)
      const popInterval = 240 + Math.random() * 120; // irregular, ~4-6s
      for (let cloud of poisonClouds) {
        if (frame - cloud.lastDart > popInterval) {
          // Pop a fireball upward from near the lava surface (use gap info if present)
          const baseY = GROUND_Y - 6;
          poisonDarts.push({
            wx: cloud.wx + (Math.random() - 0.5) * (cloud.width * 0.5),
            y: baseY,
            vy: - (3.8 + Math.random() * 2.8), // strong upward pop
            vx: (Math.random() - 0.5) * 1.6     // slight sideways drift
          });
          cloud.lastDart = frame;
        }
      }

      // Move lava fireballs (pop up then gravity pulls them back into the lava)
      for (let i = poisonDarts.length - 1; i >= 0; i--) {
        const dart = poisonDarts[i];
        dart.vy += 0.105; // gravity so they arc up and fall back
        dart.wx += (dart.vx || 0) * 0.96;
        dart.y += dart.vy;
        // remove once they sink back into slime surface or fly too far; if hit ground, splat into puddle
        if (dart.y > GROUND_Y - 2 || (dart.life !== undefined && --dart.life <= 0)) {
          if (dart.y > GROUND_Y - 2) {
            // splat: create short lived puddle (twice size effect, deadly on touch)
            playGooPop();
            slimePuddles.push({ wx: dart.wx, y: GROUND_Y, life: 300, size: 18 });
          }
          poisonDarts.splice(i, 1);
        }
      }

      // Move and collect neon orbs
      for (let i = neonOrbs.length - 1; i >= 0; i--) {
        const orb = neonOrbs[i];
        orb.wx += orb.vx;
        // Gentle floating motion
        orb.y += Math.sin(frame * 0.045 + orb.phase) * 0.35;

        // Collection
        const dx = Math.abs(player.wx + 13 - orb.wx);
        const dy = Math.abs(player.y + 13 - orb.y);
        if (dx < 22 && dy < 22) {
          const value = orb.value || 1;
          neonScore += value;
          playCollect(value === 5);

          // Collect particles - different color for green orbs
          const particleColor = (value === 5) ? '#33ff88' : '#3355aa';
          // (secondGreenTutorial clear removed)
          for (let k = 0; k < (value === 5 ? 12 : 8); k++) {
            particles.push({
              x: orb.wx,
              y: orb.y,
              vx: (Math.random() - 0.5) * 2.4,
              vy: (Math.random() - 0.5) * 2.2 - 0.6,
              life: 20 + Math.random() * 12,
              c: particleColor,
              size: 1.8
            });
          }
          neonOrbs.splice(i, 1);
          continue;
        }

        // Prune far behind
        if (orb.wx < scrollX - 60) {
          neonOrbs.splice(i, 1);
        }
      }

      // Move & recycle drifting volcanic ash plumes (slow sky layer)
      for (let ship of flyingShips) {
        ship.wx += ship.vx;
        // Recycle far off left → bring new one from far right
        if (ship.wx < scrollX - 420) {
          ship.wx = scrollX + W + 180 + Math.random() * 620;
          ship.y = 42 + Math.random() * 172;
          ship.vx = -0.55 - Math.random() * 0.95;
          ship.scale = 0.55 + Math.random() * 0.9;
        }
      }

      // Move projectiles (now small fireballs with fading smoke trail)
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        pr.wx += pr.vx;
        pr.y += pr.vy;
        pr.life--;
        // if hits ground, splat to puddle instead of just expire
        if (pr.y > GROUND_Y - 5) {
          playGooPop();
          slimePuddles.push({ wx: pr.wx, y: GROUND_Y, life: 300, size: 14 });
          projectiles.splice(i, 1);
          continue;
        }
        // Emit smoke trail particles (fading dark embers/smoke) - keep for effect, or could reskin but minimal
        if (Math.random() < 0.65) {
          particles.push({
            x: pr.wx - pr.vx * 0.4,
            y: pr.y - pr.vy * 0.4,
            vx: (Math.random() - 0.5) * 0.6 - pr.vx * 0.08,
            vy: (Math.random() - 0.5) * 0.5 - 0.3,
            life: 16 + Math.random() * 11,
            c: (Math.random() < 0.5) ? '#1a4a6e' : '#0d2840',
            size: 1.4 + Math.random()
          });
        }
        if (pr.life <= 0) projectiles.splice(i, 1);
      }

      // particles (with special slow drift for neon smoke)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.c === '#66ddff') {
          // Neon blue atmospheric smoke rises slower and fades gently
          p.vy += 0.012;
          p.vx *= 0.995;
        } else {
          p.vy += 0.22;
          p.vx *= 0.985;
        }
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // collisions with triangles
      for (let o of obstacles) {
        if (checkCollision(player, o)) {
          const now = frame;
          if (now < player.invulnUntil) {
            // Fully protected during 5-second post-shield grace period
          } else if (player.hasShield) {
            // Shield absorbs exactly one hit, then pops and grants 5 seconds invulnerability
            player.hasShield = false;
            playShieldPop();
            player.invulnUntil = now + 300; // 5 seconds at ~60fps
            // Shield pop effect (neon blue)
            for (let k = 0; k < 22; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.8 + Math.random() * 3.2;
              particles.push({
                x: player.wx + 13, y: player.y + 13,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.7,
                life: 28 + Math.random() * 18, c: '#66ddff', size: 2.0
              });
            }
          } else {
            gameState = 'over';
            playDeath('hazard');
            spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
            // small floor hit dust

      if (!levelExit && player.wx > 8088) {

        platforms = platforms.filter(p => {

        // Extended filters for all other spawn types to prevent any overlap with ladder (use x dist + y tall check for high objects; ground objs by x only)
        obstacles = obstacles.filter(o => Math.abs(o.wx - ladderCenter) >= safeMargin);
        specials = specials.filter(s => Math.abs(s.wx - ladderCenter) >= safeMargin || (s.y && s.y <= GROUND_Y - 420));
        waterGaps = waterGaps.filter(g => Math.abs(g.wx - ladderCenter) >= safeMargin);
        verticalEnemies = verticalEnemies.filter(e => !(Math.abs(e.wx - ladderCenter) < safeMargin && e.y > GROUND_Y - 420));
        ceilingFlowers = ceilingFlowers.filter(f => !(Math.abs(f.wx - ladderCenter) < safeMargin && f.baseY < 220)); // high ceiling range

    function draw() {
      // FPS counting (early in draw, before heavy work)
      fpsFrameCount++;
      const _now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
      if (_now - lastFpsTime >= 500) { fps = Math.round(fpsFrameCount * 1000 / (_now - lastFpsTime)); fpsFrameCount = 0; lastFpsTime = _now; }

      // === DEEP BLUE WATER COLUMN + SURFACE CAUSTIC GLOW ===
      // Layered deep blues / aqua tints (underwater atmosphere)
      ctx.fillStyle = '#0a1628';
      ctx.fillRect(0, 0, W, 210);
      ctx.fillStyle = '#0d2840';
      ctx.fillRect(0, 70, W, 170);
      ctx.fillStyle = '#1a4a6e';
      ctx.fillRect(0, 150, W, 200);
      // Diffuse water bands / depth haze
      ctx.fillStyle = 'rgba(34, 119, 170, 0.22)';
      ctx.fillRect(0, 30, W, 65);
      ctx.fillStyle = 'rgba(51, 170, 204, 0.12)';
      ctx.fillRect(0, 120, W, 85);
      // Near-seabed murk
      ctx.fillStyle = 'rgba(10, 40, 70, 0.28)';
      ctx.fillRect(0, 270, W, 170);

      // Pale blue-white surface light / underwater caustic glow (2x size rings + rays)
      const sunBaseX = 760;
      const sunX = sunBaseX - ((scrollX * 0.007) % 220);
      const sunY = 82;

      // Soft base atmospheric glow (blue-aqua, larger for 2x scale)
      ctx.fillStyle = 'rgba(51, 170, 204, 0.10)';
      ctx.beginPath(); ctx.arc(sunX, sunY, 140, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(136, 238, 255, 0.16)';
      ctx.beginPath(); ctx.arc(sunX, sunY, 70, 0, Math.PI * 2); ctx.fill();

      // Shimmering concentric rings (caustic light rings)
      // Each ring: slight radius offset (shimmer) + alpha flicker via sin(frame * rate + phase); aqua/blue alternating
      const ringRadii = [44, 60, 80, 102, 126, 148];
      for (let i = 0; i < ringRadii.length; i++) {
        const phase = i * 0.87;
        const shimmer = Math.sin(frame * 0.027 + phase) * 2.4;
        let alpha = 0.13 + Math.sin(frame * 0.046 + phase * 1.35) * 0.17;
        alpha = Math.max(0.06, Math.min(0.36, alpha));
        const col = (i % 2 === 0) ? '102, 221, 255' : '51, 170, 204'; // #66ddff / #33aacc
        ctx.strokeStyle = `rgba(${col}, ${alpha})`;
        ctx.lineWidth = (i % 3 === 0) ? 2.1 : 1.35;
        ctx.beginPath();
        ctx.arc(sunX, sunY, ringRadii[i] + shimmer, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Core surface light (pale blue-white layered)
      ctx.fillStyle = '#88eeff';
      ctx.beginPath(); ctx.arc(sunX, sunY, 30, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#66ddff';
      ctx.beginPath(); ctx.arc(sunX - 5, sunY - 5, 15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#eeffff';
      ctx.beginPath(); ctx.arc(sunX - 7, sunY - 7, 7, 0, Math.PI * 2); ctx.fill();

      // Beaming caustic rays (6 thin aqua beams, slow rotation + length shimmer)
      ctx.strokeStyle = 'rgba(102, 221, 255, 0.28)';
      ctx.lineWidth = 1.7;
      const numBeams = 6;
      for (let r = 0; r < numBeams; r++) {
        const ang = (r * (Math.PI * 2 / numBeams) + frame * 0.0011) % (Math.PI * 2);
        const lenShimmer = Math.sin(frame * 0.032 + r * 1.15) * 7 + 16;
        const startR = 33;
        const endR = 33 + 82 + lenShimmer;
        ctx.beginPath();
        ctx.moveTo(sunX + Math.cos(ang) * startR, sunY + Math.sin(ang) * startR);
        ctx.lineTo(sunX + Math.cos(ang) * endR, sunY + Math.sin(ang) * endR);
        ctx.stroke();
      }
      ctx.lineWidth = 1;

      // Very subtle drifting bubble/silt specks high in water (reduced 8->5)
      ctx.fillStyle = 'rgba(136, 238, 255, 0.22)';
      for (let i = 0; i < 5; i++) {
        const ax = ((i * 131 + frame * 0.18) % (W + 100)) - 50;
        const ay = 22 + ((i * 17) % 48) + Math.sin(frame * 0.022 + i) * 3.2;
        ctx.fillRect(ax, ay, 1.6, 0.9);
      }

      // Silt haze / bubble plumes (repurposed poisonClouds array for watery theme)
      for (let cloud of poisonClouds) {
        const csx = cloud.wx - scrollX * 0.04; // very slow parallax, high in water column

        const cy = cloud.y;

        // Soft blue silt body
        ctx.fillStyle = 'rgba(26, 74, 110, 0.42)';
        ctx.beginPath();
        ctx.ellipse(csx, cy, cloud.width / 2, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(51, 170, 204, 0.22)';
        ctx.beginPath();
        ctx.ellipse(csx - 2, cy - 5, cloud.width / 2.1, 6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // === DISTANT BACKGROUND SCENERY: CORAL BLOOMS + SEAWEED STALKS (parallax) ===
      // Drawn far back with strong parallax; animated frond sway + glow pulse (underwater)
      // Perf: alpha hoisted once (batch), reduced paths (stems via rects + few leaf triangles + frond ellipses), sway via phase
      ctx.globalAlpha = 0.82;
      for (let b of backgroundElements) {
        const sx = b.wx - scrollX * b.parallax;
        if (sx < -90 || sx > W + 90) continue;

        const s = b.scale || 1;
        const baseY = b.y;
        const phase = (b.phase || 0) + frame * 0.031;
        const floralPulse = Math.sin(phase * 1.3); // reuse sin for frond sway + bloom glow pulse

        if (b.type === 'largeBloom') {
          // Large coral bloom: tall blue-green stem, swaying aqua fronds, soft teal leaves, glowing cyan center
          const stemH = 56 * s;
          const stemX = sx - 1.8 * s;
          ctx.fillStyle = '#1a6a66';
          ctx.fillRect(stemX, baseY - stemH, 3.6 * s, stemH);
          // Sway offset for animated fronds/leaves (uses existing phase hook)
          const sway = Math.sin(phase) * 3.2 * s;
          const p = 1.0 + floralPulse * 0.12; // light frond pulse
          // Leaves (alternating sides, simple triangle-ish paths, low count for perf)
          ctx.fillStyle = '#227766';
          // leaf 1 lower left
          ctx.beginPath();
          ctx.moveTo(stemX + 1.5*s, baseY - 18*s);
          ctx.lineTo(stemX - 13*s + sway*0.4, baseY - 24*s);
          ctx.lineTo(stemX + 1.5*s, baseY - 30*s);
          ctx.closePath(); ctx.fill();
          // leaf 2 right
          ctx.beginPath();
          ctx.moveTo(stemX + 2*s, baseY - 32*s);
          ctx.lineTo(stemX + 15*s + sway*0.5, baseY - 28*s);
          ctx.lineTo(stemX + 2*s, baseY - 40*s);
          ctx.closePath(); ctx.fill();
          // leaf 3 left higher
          ctx.beginPath();
          ctx.moveTo(stemX + 1.2*s, baseY - 42*s);
          ctx.lineTo(stemX - 11*s + sway*0.6, baseY - 46*s);
          ctx.lineTo(stemX + 1.2*s, baseY - 50*s);
          ctx.closePath(); ctx.fill();
          // Coral head position (gentle sway)
          const hx = sx + sway * 0.7;
          const hy = baseY - 58 * s;
          // Outer soft aqua glow layer
          ctx.fillStyle = 'rgba(102, 221, 255, 0.45)';
          ctx.beginPath(); ctx.ellipse(hx, hy, 14 * s * p, 8 * s * p, 0, 0, Math.PI * 2); ctx.fill();
          // Layered fronds (aqua/teal blues, offset for bloom shape)
          ctx.fillStyle = '#33aacc';
          ctx.beginPath(); ctx.ellipse(hx - 4*s, hy - 1*s, 8*s*p, 5*s*p, 0, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(hx + 4.5*s, hy + 1.5*s, 7.5*s*p, 4.5*s*p, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#2277aa';
          ctx.beginPath(); ctx.ellipse(hx + 2*s, hy - 5*s, 7*s*p, 4.2*s*p, 0, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(hx - 5*s, hy + 3*s, 6.5*s*p, 5*s*p, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#1a5a88';
          ctx.beginPath(); ctx.ellipse(hx, hy + 1*s, 6*s*p, 3.5*s*p, 0, 0, Math.PI * 2); ctx.fill();
          // Glowing center bloom (cyan accent + pulse)
          ctx.fillStyle = `rgba(102, 221, 255, ${0.75 + 0.25 * floralPulse})`;
          ctx.beginPath(); ctx.ellipse(hx, hy, 4.5 * s * p, 3.2 * s * p, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#88eeff';
          ctx.beginPath(); ctx.ellipse(hx - 1*s, hy - 0.8*s, 1.8 * s, 1.2 * s, 0, 0, Math.PI * 2); ctx.fill();
        } else if (b.type === 'midStalk') {
          // Midground seaweed stalk cluster: compact stems, small leaves + aqua glowing mini-fronds (sway anim)
          const stemH = 36 * s;
          ctx.fillStyle = '#1a5a55';
          ctx.fillRect(sx - 1.2 * s, baseY - stemH, 2.4 * s, stemH);
          const sway = Math.sin(phase * 0.95) * 2.1 * s;
          const p = 1.0 + floralPulse * 0.15;
          // Small side leaves
          ctx.fillStyle = '#228866';
          ctx.beginPath();
          ctx.moveTo(sx, baseY - 12*s);
          ctx.lineTo(sx - 8*s + sway*0.5, baseY - 15*s);
          ctx.lineTo(sx, baseY - 20*s);
          ctx.closePath(); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(sx + 0.5*s, baseY - 25*s);
          ctx.lineTo(sx + 9*s + sway*0.6, baseY - 23*s);
          ctx.lineTo(sx + 0.5*s, baseY - 30*s);
          ctx.closePath(); ctx.fill();
          // Mini fronds / glowing clusters (2-3)
          ctx.fillStyle = 'rgba(102, 221, 255, 0.45)';
          ctx.beginPath(); ctx.ellipse(sx + 3*s + sway*0.4, baseY - 37*s, 5.5*s*p, 3.5*s*p, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#33aacc';
          ctx.beginPath(); ctx.ellipse(sx + 3*s + sway*0.4, baseY - 37*s, 3*s*p, 2.2*s*p, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#004466';
          ctx.beginPath(); ctx.ellipse(sx + 3*s + sway*0.4, baseY - 37*s, 1.6*s, 1.1*s, 0, 0, Math.PI*2); ctx.fill();
          // Second small bloom higher/side
          ctx.fillStyle = 'rgba(51, 170, 204, 0.4)';
          ctx.beginPath(); ctx.ellipse(sx - 5*s + sway*0.6, baseY - 29*s, 4.2*s*p, 2.8*s*p, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#66ddff';
          ctx.beginPath(); ctx.ellipse(sx - 5*s + sway*0.6, baseY - 29*s, 2.3*s, 1.6*s, 0, 0, Math.PI*2); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      // === DRIFTING SILT / BUBBLE CLOUDS (repurposed background traffic layer) ===
      ctx.globalAlpha = 0.32;
      for (let ship of flyingShips) {
        const sx = ship.wx - scrollX * ship.parallax;
        if (sx < -110 || sx > W + 130) continue;

        const s = ship.scale;
        const sy = ship.y;

        // Puffy blue silt cloud body (multi layered ellipses)
        ctx.fillStyle = 'rgba(26, 74, 110, 0.75)';
        ctx.beginPath(); ctx.ellipse(sx + 8*s, sy + 2*s, 22*s, 7*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(sx + 22*s, sy - 1*s, 18*s, 9*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(sx - 2*s, sy + 3*s, 14*s, 6*s, 0, 0, Math.PI*2); ctx.fill();

        // Aqua glow core inside some plumes
        if ((Math.floor(ship.wx) % 3) !== 0) {
          ctx.fillStyle = 'rgba(102, 221, 255, 0.28)';
          ctx.beginPath(); ctx.ellipse(sx + 14*s, sy + 1*s, 6*s, 3*s, 0, 0, Math.PI*2); ctx.fill();
        }

        // Faint trailing silt wisps
        ctx.fillStyle = 'rgba(34, 100, 150, 0.25)';
        ctx.fillRect(sx - 18*s, sy + 1*s, 14*s, 3*s);
      }
      ctx.globalAlpha = 1;

      // === AQUA SUBMERSIBLE DRONES (gliding high in water column, ptero array reused)
      for (let p of pteros) {
        const sx = p.wx - scrollX;
        if (sx < -80 || sx > W + 80) continue;
        const sy = p.y;
        const flap = Math.sin(frame * 0.18 + p.phase) * 0.75;
        // Outer aqua energy aura glow
        ctx.fillStyle = 'rgba(51, 170, 204, 0.18)';
        ctx.beginPath();
        ctx.ellipse(sx + 14, sy + 1, 22, 9 + flap * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Main drone body (boxy sub, deep blue tech)
        ctx.fillStyle = '#0d2840';
        ctx.fillRect(sx + 2, sy - 3, 24, 8);
        ctx.fillStyle = '#1a4a6e';
        ctx.beginPath();
        ctx.ellipse(sx + 14, sy + 1, 13, 6 + flap * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
        // Metallic panel highlights
        ctx.fillStyle = '#66ddff';
        ctx.fillRect(sx + 6, sy - 1, 5, 2);
        ctx.fillRect(sx + 17, sy + 1, 4, 1.5);
        // Fin / wing panels (geometric, animated with flap)
        ctx.fillStyle = '#2277aa';
        ctx.beginPath();
        ctx.moveTo(sx + 5, sy + 1);
        ctx.lineTo(sx - 4, sy - 12 - flap * 2.5);
        ctx.lineTo(sx + 1, sy - 1);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(sx + 23, sy + 1);
        ctx.lineTo(sx + 32, sy - 11 + flap * 2);
        ctx.lineTo(sx + 26, sy);
        ctx.closePath();
        ctx.fill();
        // Rotor blades (thin lines for tech)
        ctx.strokeStyle = '#88eeff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sx - 2, sy - 8 - flap);
        ctx.lineTo(sx + 4, sy - 14 - flap * 3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sx + 26, sy - 7 + flap * 0.8);
        ctx.lineTo(sx + 33, sy - 13 + flap * 2.5);
        ctx.stroke();
        ctx.lineWidth = 1;
        // Cyan tech accents / lights
        ctx.fillStyle = '#88eeff';
        ctx.beginPath();
        ctx.arc(sx + 8, sy + 0.5, 1.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(sx + 20, sy + 1.5, 1.1, 0, Math.PI * 2);
        ctx.fill();
        // Head/sensor dome (forward)
        ctx.fillStyle = '#003355';
        ctx.beginPath();
        ctx.ellipse(sx + 27, sy + 1, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        // Eye
        ctx.fillStyle = '#66ddff';
        ctx.beginPath();
        ctx.arc(sx + 27, sy - 0.8, 1.2, 0, Math.PI * 2);
        ctx.fill();
        // Long tail (waving)
        ctx.strokeStyle = '#0a1628';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(sx + 2, sy + 1);
        ctx.quadraticCurveTo(sx - 12, sy + 4 + Math.sin(frame * 0.11 + p.phase) * 3, sx - 28, sy + 2 + Math.sin(frame * 0.09 + p.phase * 1.3) * 5);
        ctx.stroke();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = '#1a4a6e';
        ctx.beginPath();
        ctx.moveTo(sx + 2, sy + 1);
        ctx.quadraticCurveTo(sx - 10, sy + 3, sx - 24, sy + 1);
        ctx.stroke();
        // Wings (flapping, aqua energy vein glow)
        ctx.fillStyle = '#0d2840';
        ctx.beginPath();
        ctx.moveTo(sx + 8, sy);
        ctx.quadraticCurveTo(sx - 2, sy - 18 - flap * 2, sx + 4, sy - 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(sx + 20, sy);
        ctx.quadraticCurveTo(sx + 30, sy - 16 + flap * 1.5, sx + 24, sy - 1);
        ctx.fill();
        // Aqua veins on wings (pulsing cyan)
        ctx.strokeStyle = `rgba(102, 221, 255, ${0.5 + 0.4 * Math.sin(frame * 0.2 + p.phase)})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(sx + 5, sy - 1);
        ctx.lineTo(sx - 1, sy - 10);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sx + 18, sy);
        ctx.lineTo(sx + 28, sy - 9);
        ctx.stroke();
        ctx.lineWidth = 1;
      }

      // === DEEP BLUE SEABED / FLOOR (stone + aqua water seams) ===
      const floorTop = GROUND_Y - 2;

      // Precompute if any water pit visible this frame (cheap loop; skips costly shadow/save when none)
      let hasVisibleLava = false;
      for (let gap of waterGaps) {
        const sx = gap.wx - scrollX;
        const gw = gap.width;
        if (sx + gw >= -20 && sx <= W + 20) { hasVisibleLava = true; break; }
      }

      // Subtle aqua glow from water pits / ground (conditional to avoid save/shadow thrash every frame)
      if (hasVisibleLava) {
        ctx.save();
        ctx.shadowColor = '#0d2840';
        ctx.shadowBlur = 22;
        ctx.fillStyle = 'rgba(34, 119, 170, 0.18)';
        ctx.fillRect(0, floorTop - 7, W, 38);
        ctx.shadowBlur = 10;
        ctx.fillStyle = 'rgba(51, 170, 204, 0.12)';
        ctx.fillRect(0, floorTop - 1, W, 16);
        ctx.restore();
      }

      // Base deep blue stone seabed floor
      ctx.fillStyle = '#0d1e30';
      ctx.fillRect(0, floorTop, W, H - floorTop);

      // Rough top edge / lip
      ctx.fillStyle = '#1a3a55';
      ctx.fillRect(0, floorTop, W, 3.2);

      // Cracked stone texture / seams (parallax scroll; reduced iters)
      ctx.fillStyle = 'rgba(8, 20, 35, 0.55)';
      const mOffset = (scrollX * 1.25) % 62;
      for (let i = -1; i < 11; i++) {
        const mx = i * 62 - mOffset + 12;
        ctx.fillRect(mx, floorTop + 6, 18, 1.6);
      }
      // Secondary cracks
      ctx.fillStyle = 'rgba(26, 60, 90, 0.35)';
      const mOffset2 = (scrollX * 0.55) % 104;
      for (let i = -1; i < 7; i++) {
        const mx = i * 104 - mOffset2 + 28;
        ctx.fillRect(mx, floorTop + 13, 32, 1.2);
      }
      // Occasional glowing aqua seams in floor cracks
      ctx.fillStyle = 'rgba(102, 221, 255, 0.18)';
      const seamOffset = (scrollX * 0.85) % 240;
      for (let i = -1; i < 2; i++) {
        const sx = i * 240 - seamOffset + 55;
        ctx.fillRect(sx, floorTop + 5, 7, 1.5);
      }

      // === LOW WALLS / BARRIERS (must jump over - solid but non-lethal) ===
      for (let wall of lowWalls) {
        const sx = wall.wx - scrollX;
        if (sx < -30 || sx > W + 30) continue;

        const wh = wall.height;
        const ww = wall.width;

        // Base stone-like block (deep blue seabed rock)
        ctx.fillStyle = '#0a1a2c';
        ctx.fillRect(sx, GROUND_Y - wh, ww, wh);

        // Top edge (slightly lighter, looks like a lip)
        ctx.fillStyle = '#1a3a55';
        ctx.fillRect(sx, GROUND_Y - wh, ww, 4);

        // Subtle top highlight line
        ctx.fillStyle = '#2a5580';
        ctx.fillRect(sx, GROUND_Y - wh, ww, 1.5);

        // Small vertical "support" lines for texture
        ctx.fillStyle = 'rgba(10, 30, 50, 0.6)';
        ctx.fillRect(sx + 3, GROUND_Y - wh + 3, 1.5, wh - 5);
        ctx.fillRect(sx + ww - 5, GROUND_Y - wh + 3, 1.5, wh - 5);
      }

      // === BLUE WATER PITS (deadly if fallen into; keep deadly behavior, blue water look) ===
      for (let gap of waterGaps) {
        const sx = gap.wx - scrollX;
        const gw = gap.width;
        if (sx + gw < -20 || sx > W + 20) continue;

        const pitDepth = 135; // deep water pool visually

        // Deep blue rock/seabed rim / upper edges of pit
        ctx.fillStyle = '#0a1e32';
        ctx.fillRect(sx - 1, floorTop - 1, gw + 2, 7);
        // Cracked rim texture
        ctx.fillStyle = '#061420';
        ctx.fillRect(sx + 3, floorTop, 2, 4);
        ctx.fillRect(sx + gw - 7, floorTop + 1, 3, 3);

        // Subtle aqua glow on upper pit walls
        ctx.fillStyle = 'rgba(34, 119, 170, 0.45)';
        ctx.fillRect(sx, floorTop + 5, 3, 22);
        ctx.fillRect(sx + gw - 3, floorTop + 5, 3, 22);

        // === FULL DEPTH BLUE WATER (animated flow + bubbles) ===
        // Deep base water
        ctx.fillStyle = '#003355';
        ctx.fillRect(sx + 1, floorTop + 5, gw - 2, pitDepth);

        // Mid water layer
        ctx.fillStyle = '#004466';
        ctx.fillRect(sx + 2, floorTop + 8, gw - 4, pitDepth - 12);

        // Side wall water glow
        ctx.fillStyle = 'rgba(34, 119, 170, 0.32)';
        ctx.fillRect(sx + 1, floorTop + 18, 2, pitDepth - 10);
        ctx.fillRect(sx + gw - 3, floorTop + 18, 2, pitDepth - 10);

        // Upper brighter water surface
        ctx.fillStyle = 'rgba(26, 90, 140, 0.92)';
        ctx.fillRect(sx + 1, floorTop + 5, gw - 2, 28);
        ctx.fillStyle = 'rgba(51, 170, 204, 0.72)';
        ctx.fillRect(sx + 1, floorTop + 6, gw - 2, 11);

        // Animated vertical flow streaks
        const flowT = (frame * 0.035) % (gw + 50);
        const flowPhase = gap.wx * 0.013; // seeded by position for variation
        ctx.fillStyle = 'rgba(102, 221, 255, 0.26)';
        for (let f = 0; f < 3; f++) {
          const phaseOff = (f * 1.3 + flowPhase);
          const dripOff = Math.sin(frame * 0.022 + phaseOff) * 4.5;
          const fx = sx + 5 + ((f * 19 + flowT * 0.55) % (gw - 10));
          const fy = floorTop + 10 + dripOff * 0.6;
          ctx.fillRect(fx, fy, 2.2, pitDepth - 20 - (f % 2));
        }
        ctx.fillStyle = 'rgba(136, 238, 255, 0.15)';
        for (let f = 0; f < 2; f++) {
          const phaseOff = (f * 2.1 + flowPhase + 1.7);
          const dripOff = Math.sin(frame * 0.018 + phaseOff) * 6.2;
          const fx = sx + 9 + ((f * 27 + flowT * 0.8) % (gw - 14));
          const fy = floorTop + 13 + dripOff * 0.5;
          ctx.fillRect(fx, fy, 1.6, pitDepth - 28);
        }
